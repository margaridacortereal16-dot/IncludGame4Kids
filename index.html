<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê do Mundo - Jogo Intercultural para Crianças</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Tone.js para Sons e Sintetizador Musical -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti para Celebrações -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#4A90E2',
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            pink: '#EF476F',
                            purple: '#118AB2',
                            cream: '#FFFDF9',
                            darkText: '#2B2D42'
                        }
                    },
                    fontFamily: {
                        sans: ['Comic Sans MS', 'Fredoka', 'Chalkboard SE', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFDF9;
            color: #2B2D42;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Alto Contraste */
        body.high-contrast {
            background-color: #000000 !important;
            color: #FFFF00 !important;
        }
        body.high-contrast .hc-element {
            background-color: #000000 !important;
            border: 4px solid #FFFF00 !important;
            color: #FFFF00 !important;
        }
        body.high-contrast button {
            background-color: #FFFF00 !important;
            color: #000000 !important;
            font-weight: bold !important;
            border: 3px solid #FFFFFF !important;
        }

        /* Modo Calmo */
        body.calm-mode {
            background-color: #F4F1EA !important;
            filter: saturate(0.6);
        }
        body.calm-mode * {
            animation: none !important;
            transition: none !important;
        }

        /* Botões tácteis de grande dimensão para crianças */
        .btn-kid {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
        }
        .btn-kid:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        /* Animações suaves de pulso para botões e pistas */
        @keyframes pulse-gentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .animate-pulse-gentle {
            animation: pulse-gentle 2.5s infinite ease-in-out;
        }

        /* Animações de Cartão Selecionado e Erro */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Canvas e Elementos Tácteis */
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans overflow-x-hidden">

    <!-- BARRA SUPERIOR DO NÚCLEO (Sempre Visível) -->
    <header class="bg-brand-yellow/30 border-b-4 border-brand-yellow p-3 sm:p-4 flex flex-wrap justify-between items-center gap-2 z-40 relative hc-element">
        <div class="flex items-center gap-3">
            <button onclick="CoreApp.goHome()" class="btn-kid bg-brand-pink text-white px-4 py-2 sm:px-6 sm:py-3 rounded-full text-xl font-bold flex items-center gap-2" title="Voltar ao Início">
                <i class="fa-solid fa-house text-2xl"></i>
                <span class="hidden sm:inline" data-i18n="home">Início</span>
            </button>
            <h1 class="text-xl sm:text-2xl font-black text-brand-purple tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-palette text-brand-pink"></i>
                <span>Ateliê do Mundo</span>
            </h1>
        </div>

        <!-- Botões de Ação Global do Núcleo -->
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
            <!-- Idiomas -->
            <div class="bg-white rounded-full p-1 border-2 border-gray-200 flex gap-1 shadow-sm hc-element">
                <button onclick="CoreApp.setLanguage('pt')" id="lang-pt" class="px-2 py-1 rounded-full text-sm font-bold bg-brand-blue text-white">PT</button>
                <button onclick="CoreApp.setLanguage('en')" id="lang-en" class="px-2 py-1 rounded-full text-sm font-bold text-gray-600">EN</button>
                <button onclick="CoreApp.setLanguage('es')" id="lang-es" class="px-2 py-1 rounded-full text-sm font-bold text-gray-600">ES</button>
            </div>

            <!-- Botão "A minha cultura também conta" -->
            <button onclick="CoreApp.openCultureMode()" class="btn-kid bg-brand-green text-white px-3 py-2 sm:px-4 sm:py-2 rounded-2xl font-bold text-sm sm:text-base flex items-center gap-2 animate-pulse-gentle">
                <i class="fa-solid fa-heart text-lg"></i>
                <span data-i18n="my_culture_btn">A Minha Cultura Conta!</span>
            </button>

            <!-- Mural da Sala -->
            <button onclick="CoreApp.openMural()" class="btn-kid bg-brand-blue text-white px-3 py-2 sm:px-4 sm:py-2 rounded-2xl font-bold text-sm sm:text-base flex items-center gap-2">
                <i class="fa-solid fa-images text-lg"></i>
                <span data-i18n="mural_btn">Mural da Sala</span>
            </button>

            <!-- Menu de Acessibilidade -->
            <button onclick="AccessibilityModule.toggleMenu()" class="btn-kid bg-purple-600 text-white px-3 py-2 rounded-2xl font-bold text-sm flex items-center gap-1" title="Acessibilidade">
                <i class="fa-solid fa-universal-access text-xl"></i>
            </button>
        </div>
    </header>

    <!-- PAINEL FLUTUANTE DE ACESSIBILIDADE (7 Recursos) -->
    <div id="accessibility-menu" class="hidden fixed top-16 right-4 bg-white border-4 border-purple-600 p-5 rounded-3xl shadow-2xl z-50 max-w-sm w-full hc-element">
        <div class="flex justify-between items-center border-b pb-3 mb-3">
            <h2 class="font-bold text-lg text-purple-900 flex items-center gap-2">
                <i class="fa-solid fa-universal-access"></i> Acessibilidade
            </h2>
            <button onclick="AccessibilityModule.toggleMenu()" class="text-gray-500 text-2xl font-bold">&times;</button>
        </div>
        <div class="space-y-3 text-sm">
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-volume-high text-purple-600"></i> Áudio-Descrição Voz</span>
                <input type="checkbox" id="chk-audio" checked onchange="AccessibilityModule.updateSettings()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-hand text-purple-600"></i> Texturas e Vibração</span>
                <input type="checkbox" id="chk-vibe" checked onchange="AccessibilityModule.updateSettings()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-circle-half-stroke text-purple-600"></i> Alto Contraste</span>
                <input type="checkbox" id="chk-contrast" onchange="AccessibilityModule.toggleContrast()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-hands-asl-interpreting text-purple-600"></i> Avatar/Vídeo LGP</span>
                <input type="checkbox" id="chk-lgp" checked onchange="AccessibilityModule.updateSettings()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-icons text-purple-600"></i> Modo Pictogramas</span>
                <input type="checkbox" id="chk-pics" checked onchange="AccessibilityModule.updateSettings()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-feather text-purple-600"></i> Modo Calmo (Sons Suaves)</span>
                <input type="checkbox" id="chk-calm" onchange="AccessibilityModule.toggleCalmMode()" class="w-5 h-5">
            </label>
            <label class="flex items-center justify-between p-2 bg-purple-50 rounded-xl cursor-pointer">
                <span class="flex items-center gap-2 font-bold"><i class="fa-solid fa-font text-purple-600"></i> Texto Grande e Leitura Fácil</span>
                <input type="checkbox" id="chk-easyread" onchange="AccessibilityModule.toggleEasyRead()" class="w-5 h-5">
            </label>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL DA APLICAÇÃO -->
    <main id="app-content" class="flex-1 p-4 max-w-7xl mx-auto w-full flex flex-col justify-center items-center">
        <!-- O conteúdo é injetado dinamicamente via JS -->
    </main>

    <!-- AVATAR LGP EM TEMPO REAL E INTERATIVO -->
    <div id="lgp-box" class="fixed bottom-4 right-4 bg-white border-4 border-brand-purple p-2 sm:p-3 rounded-3xl shadow-2xl z-30 flex flex-col items-center hc-element transition-all duration-300">
        <div class="w-full flex justify-between items-center text-xs font-black text-brand-purple gap-2">
            <button onclick="AccessibilityModule.toggleLgpSize()" class="flex items-center gap-1.5 hover:text-brand-pink transition">
                <i class="fa-solid fa-hands-asl-interpreting text-brand-pink text-base"></i>
                <span>LGP</span>
            </button>
            <div class="flex items-center gap-1">
                <button onclick="AccessibilityModule.openLgpDictionary()" class="text-purple-600 hover:text-purple-900 text-xs px-1" title="Dicionário de LGP">
                    <i class="fa-solid fa-book-open"></i>
                </button>
                <button onclick="AccessibilityModule.toggleLgpSize()" id="btn-lgp-toggle" class="text-gray-500 hover:text-black text-xs px-1" title="Expandir/Minimizar">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <div id="lgp-body" class="hidden w-full mt-2 flex-col items-center">
            <div id="lgp-display" class="w-full h-28 sm:h-32 bg-purple-50 rounded-2xl border-2 border-purple-200 flex flex-col items-center justify-center relative overflow-hidden p-2">
                <svg id="lgp-avatar-svg" viewBox="0 0 100 100" class="w-24 h-24 transition-transform duration-300">
                    <circle cx="50" cy="32" r="16" fill="#FFD166" stroke="#2B2D42" stroke-width="2"/>
                    <circle cx="44" cy="30" r="2.2" fill="#2B2D42"/>
                    <circle cx="56" cy="30" r="2.2" fill="#2B2D42"/>
                    <path d="M44 38 Q50 43 56 38" stroke="#2B2D42" stroke-width="2" fill="none"/>
                    <path d="M28 85 C28 58 72 58 72 85 Z" fill="#118AB2"/>
                    
                    <g id="lgp-gesture-lines" class="opacity-0 transition-opacity duration-300">
                        <path d="M18 25 Q23 18 28 25" stroke="#EF476F" stroke-width="2" stroke-dasharray="2,2" fill="none"/>
                        <path d="M72 25 Q77 18 82 25" stroke="#EF476F" stroke-width="2" stroke-dasharray="2,2" fill="none"/>
                    </g>

                    <g id="lgp-left-arm" class="transition-transform duration-200 origin-bottom-left">
                        <path d="M30 65 Q20 50 25 38" stroke="#FFD166" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <path d="M21 38 Q24 28 27 38 Q29 30 29 38 T25 43 Z" fill="#FFD166" stroke="#2B2D42" stroke-width="1.2"/>
                    </g>

                    <g id="lgp-right-arm" class="transition-transform duration-200 origin-bottom-right">
                        <path d="M70 65 Q80 50 75 38" stroke="#FFD166" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <path d="M79 38 Q76 28 73 38 Q71 30 71 38 T75 43 Z" fill="#FFD166" stroke="#2B2D42" stroke-width="1.2"/>
                    </g>
                </svg>

                <span id="lgp-sign-label" class="absolute bottom-1 bg-brand-purple text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap max-w-full truncate">
                    LGP Ativa
                </span>
            </div>

            <div class="w-full mt-2 flex justify-between items-center gap-1">
                <button onclick="AccessibilityModule.speak('Olá! Vamos aprender Língua Gestual Portuguesa!')" class="flex-1 bg-purple-100 hover:bg-purple-200 text-purple-900 text-[10px] font-bold py-1 px-1 rounded-xl text-center">
                    <i class="fa-solid fa-hand"></i> Olá!
                </button>
                <button onclick="AccessibilityModule.openLgpDictionary()" class="bg-brand-pink text-white text-[10px] font-bold py-1 px-2 rounded-xl">
                    Ver Sinais
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DO DICIONÁRIO DE LGP -->
    <div id="lgp-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 border-8 border-brand-purple shadow-2xl relative max-h-[90vh] overflow-y-auto hc-element">
            <button onclick="AccessibilityModule.closeLgpDictionary()" class="absolute top-4 right-4 bg-red-500 text-white w-10 h-10 rounded-full font-bold text-xl flex items-center justify-center shadow-lg">
                &times;
            </button>
            <div class="text-center mb-6">
                <span class="bg-purple-100 text-purple-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Acessibilidade Inclusiva</span>
                <h2 class="text-3xl font-black text-brand-purple mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-hands-asl-interpreting text-brand-pink"></i> Dicionário de LGP da Sala
                </h2>
                <p class="text-sm text-gray-600 mt-1">Clica num sinal para ver a demonstração em Língua Gestual Portuguesa!</p>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="lgp-cards-container"></div>
        </div>
    </div>

    <!-- MODAL DA FICHA DE OBRA (4 Perguntas Obrigatórias) -->
    <div id="ficha-obra-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 border-8 border-brand-yellow shadow-2xl relative max-h-[90vh] overflow-y-auto hc-element">
            <button onclick="FichaObraModule.close()" class="absolute top-4 right-4 bg-red-500 text-white w-10 h-10 rounded-full font-bold text-xl flex items-center justify-center">
                &times;
            </button>
            <div id="ficha-obra-content"></div>
        </div>
    </div>

    <script>
        const CoreApp = {
            currentLang: 'pt',
            currentModule: 'home',
            
            translations: {
                pt: {
                    home: "Início",
                    my_culture_btn: "A Minha Cultura Conta!",
                    mural_btn: "Mural da Sala",
                    welcome: "Bem-vindo ao Ateliê do Mundo!",
                    subtitle: "Escolha um jogo para pintar, tocar, criar e descobrir culturas maravilhosas!",
                    game1_title: "Bordado do Minho",
                    game1_sub: "Lenço dos Namorados",
                    game2_title: "Fado de Lisboa",
                    game2_sub: "Guitarra Portuguesa",
                    game3_title: "Máscaras de África",
                    game3_sub: "Jogo de Memória com Máscaras",
                    game4_title: "Jogo de Sombras do Japão",
                    game4_sub: "Correspondência entre imagem e sombra",
                    game5_title: "Casas de Santana",
                    game5_sub: "Ordenar a sequência da Casa de Santana",
                    level: "Nível",
                    free: "Livre",
                    pattern: "Padrão",
                    create: "Criar",
                    save_mural: "Guardar no Mural!",
                    speak_tooltip: "Ouvir áudio-descrição"
                },
                en: {
                    home: "Home",
                    my_culture_btn: "My Culture Matters!",
                    mural_btn: "Classroom Mural",
                    welcome: "Welcome to World Atelier!",
                    subtitle: "Pick a game to paint, play music, create and learn about cultures!",
                    game1_title: "Minho Embroidery",
                    game1_sub: "Sweetheart Handkerchief",
                    game2_title: "Lisbon Fado",
                    game2_sub: "Portuguese Guitar",
                    game3_title: "African Masks",
                    game3_sub: "Memory Game with Masks",
                    game4_title: "Japanese Shadow Matching",
                    game4_sub: "Match the object with its shadow",
                    game5_title: "Santana Houses",
                    game5_sub: "Order the Santana house construction sequence",
                    level: "Level",
                    free: "Free",
                    pattern: "Pattern",
                    create: "Create",
                    save_mural: "Save to Mural!",
                    speak_tooltip: "Listen to audio description"
                },
                es: {
                    home: "Inicio",
                    my_culture_btn: "¡Mi Cultura Cuenta!",
                    mural_btn: "Mural de Clase",
                    welcome: "¡Bienvenidos al Taller del Mundo!",
                    subtitle: "¡Elige un juego para pintar, tocar música y descubrir culturas!",
                    game1_title: "Bordado de Minho",
                    game1_sub: "Pañuelo de Enamorados",
                    game2_title: "Fado de Lisboa",
                    game2_sub: "Guitarra Portuguesa",
                    game3_title: "Máscaras de África",
                    game3_sub: "Juego de Memoria con Máscaras",
                    game4_title: "Juego de Sombras de Japón",
                    game4_sub: "Empareja la imagen con su sombra",
                    game5_title: "Casas de Santana",
                    game5_sub: "Ordenar la secuencia de la casa de Santana",
                    level: "Nivel",
                    free: "Libre",
                    pattern: "Patrón",
                    create: "Crear",
                    save_mural: "¡Guardar en el Mural!",
                    speak_tooltip: "Escuchar audio"
                }
            },

            init() {
                this.renderHome();
                AccessibilityModule.speak("Bem-vindo ao Ateliê do Mundo! Escolha uma atividade com a ajuda dos pictogramas.");
            },

            setLanguage(lang) {
                this.currentLang = lang;
                document.querySelectorAll('#lang-pt, #lang-en, #lang-es').forEach(btn => {
                    btn.classList.remove('bg-brand-blue', 'text-white');
                    btn.classList.add('text-gray-600');
                });
                document.getElementById(`lang-${lang}`).classList.add('bg-brand-blue', 'text-white');
                
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.translations[lang][key]) {
                        el.innerText = this.translations[lang][key];
                    }
                });

                if (this.currentModule === 'home') this.renderHome();
            },

            goHome() {
                this.currentModule = 'home';
                this.renderHome();
                AccessibilityModule.speak("Voltámos à página principal do Ateliê.");
            },

            renderHome() {
                const t = this.translations[this.currentLang];
                const content = document.getElementById('app-content');
                content.innerHTML = `
                    <div class="text-center my-4 animate-fade-in">
                        <h2 class="text-3xl sm:text-4xl font-extrabold text-brand-purple mb-2">${t.welcome}</h2>
                        <p class="text-lg text-gray-700 max-w-xl mx-auto flex items-center justify-center gap-2">
                            <span>${t.subtitle}</span>
                            <button onclick="AccessibilityModule.speak('${t.welcome}. ${t.subtitle}')" class="text-brand-pink text-2xl" title="${t.speak_tooltip}">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </p>
                    </div>

                    <!-- GRELHA DOS 5 JOGOS MÓDULOS -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full my-6">
                        
                        <!-- JOGO 1: MINHO -->
                        <div onclick="Game1_Minho.start()" class="btn-kid bg-pink-100 border-4 border-brand-pink rounded-3xl p-5 cursor-pointer hover:scale-[1.02] flex flex-col items-center text-center hc-element">
                            <div class="w-20 h-20 bg-brand-pink text-white rounded-2xl flex items-center justify-center text-4xl mb-3 shadow-inner">
                                <i class="fa-solid fa-heart"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-widest text-brand-pink">Portugal - Minho</span>
                            <h3 class="text-2xl font-black text-gray-800">${t.game1_title}</h3>
                            <p class="text-sm text-gray-600 mt-1">${t.game1_sub}</p>
                            <div class="mt-4 flex gap-1 text-xs bg-white px-3 py-1 rounded-full font-bold border text-pink-700">
                                <i class="fa-solid fa-vest"></i> 3 Níveis • Bordar com o dedo
                            </div>
                        </div>

                        <!-- JOGO 2: LISBOA -->
                        <div onclick="Game2_Lisboa.start()" class="btn-kid bg-amber-100 border-4 border-amber-500 rounded-3xl p-5 cursor-pointer hover:scale-[1.02] flex flex-col items-center text-center hc-element">
                            <div class="w-20 h-20 bg-amber-500 text-white rounded-2xl flex items-center justify-center text-4xl mb-3 shadow-inner">
                                <i class="fa-solid fa-music"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-widest text-amber-600">Portugal - Lisboa</span>
                            <h3 class="text-2xl font-black text-gray-800">${t.game2_title}</h3>
                            <p class="text-sm text-gray-600 mt-1">${t.game2_sub}</p>
                            <div class="mt-4 flex gap-1 text-xs bg-white px-3 py-1 rounded-full font-bold border text-amber-700">
                                <i class="fa-solid fa-guitar"></i> 3 Níveis • Tocar & Gravar
                            </div>
                        </div>

                        <!-- JOGO 3: ÁFRICA -->
                        <div onclick="Game3_Africa.start()" class="btn-kid bg-emerald-100 border-4 border-emerald-600 rounded-3xl p-5 cursor-pointer hover:scale-[1.02] flex flex-col items-center text-center hc-element">
                            <div class="w-20 h-20 bg-emerald-600 text-white rounded-2xl flex items-center justify-center text-4xl mb-3 shadow-inner">
                                <i class="fa-solid fa-mask"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-widest text-emerald-700">África Diversa</span>
                            <h3 class="text-2xl font-black text-gray-800">${t.game3_title}</h3>
                            <p class="text-sm text-gray-600 mt-1">${t.game3_sub}</p>
                            <div class="mt-4 flex gap-1 text-xs bg-white px-3 py-1 rounded-full font-bold border text-emerald-700">
                                <i class="fa-solid fa-brain"></i> 3 Níveis • Memória Visual
                            </div>
                        </div>

                        <!-- JOGO 4: JAPÃO -->
                        <div onclick="Game4_Japan.start()" class="btn-kid bg-red-100 border-4 border-red-500 rounded-3xl p-5 cursor-pointer hover:scale-[1.02] flex flex-col items-center text-center hc-element">
                            <div class="w-20 h-20 bg-red-500 text-white rounded-2xl flex items-center justify-center text-4xl mb-3 shadow-inner">
                                <i class="fa-solid fa-shapes"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-widest text-red-600">Japão</span>

            animateLgpHands(gestureKey = 'wave', label = 'Tradução Ativa') {
                const labelEl = document.getElementById('lgp-sign-label');
                const leftArm = document.getElementById('lgp-left-arm');
                const rightArm = document.getElementById('lgp-right-arm');
                const gestureLines = document.getElementById('lgp-gesture-lines');
                const svgAvatar = document.getElementById('lgp-avatar-svg');

                if (labelEl) labelEl.innerText = label;

                if (leftArm && rightArm && svgAvatar) {
                    if (gestureLines) gestureLines.classList.remove('opacity-0');
                    svgAvatar.classList.add('scale-110');

                    let ticks = 0;
                    const interval = setInterval(() => {
                        ticks++;
                        const step = ticks % 2;

                        switch (gestureKey) {
                            case 'wave':
                                rightArm.style.transform = step === 0 ? 'translate(6px, -22px) rotate(30deg)' : 'translate(-4px, -22px) rotate(-15deg)';
                                leftArm.style.transform = 'translate(0, 4px)';
                                break;
                            case 'roof':
                                leftArm.style.transform = 'translate(13px, -24px) rotate(38deg)';
                                rightArm.style.transform = 'translate(-13px, -24px) rotate(-38deg)';
                                break;
                            case 'thanks':
                                rightArm.style.transform = step === 0 ? 'translate(-16px, -18px) rotate(-25deg)' : 'translate(-16px, -6px) rotate(-5deg)';
                                leftArm.style.transform = 'translate(0, 4px)';
                                break;
                            case 'mask':
                                leftArm.style.transform = step === 0 ? 'translate(12px, -24px) rotate(22deg)' : 'translate(8px, -22px) rotate(12deg)';
                                rightArm.style.transform = step === 0 ? 'translate(-12px, -24px) rotate(-22deg)' : 'translate(-8px, -22px) rotate(-12deg)';
                                break;
                            case 'heart':
                                leftArm.style.transform = step === 0 ? 'translate(14px, -12px) rotate(35deg)' : 'translate(4px, -4px) rotate(10deg)';
                                rightArm.style.transform = step === 0 ? 'translate(-14px, -12px) rotate(-35deg)' : 'translate(-4px, -4px) rotate(-10deg)';
                                break;
                            case 'rhythm':
                                leftArm.style.transform = step === 0 ? 'translate(0px, -14px) rotate(15deg)' : 'translate(0px, -4px) rotate(-10deg)';
                                rightArm.style.transform = step === 0 ? 'translate(0px, -4px) rotate(-10deg)' : 'translate(0px, -14px) rotate(15deg)';
                                break;
                            case 'pinch':
                            case 'draw':
                                rightArm.style.transform = step === 0 ? 'translate(-10px, -12px) rotate(-12deg)' : 'translate(-12px, -16px) rotate(12deg)';
                                leftArm.style.transform = 'translate(4px, -8px) rotate(8deg)';
                                break;
                            default:
                                rightArm.style.transform = step === 0 ? 'translateY(-8px)' : 'translateY(0px)';
                                leftArm.style.transform = step === 0 ? 'translateY(0px)' : 'translateY(-8px)';
                                break;
                        }

                        if (ticks >= 8) {
                            clearInterval(interval);
                            svgAvatar.classList.remove('scale-110');
                            if (gestureLines) gestureLines.classList.add('opacity-0');
                            setTimeout(() => {
                                leftArm.style.transform = '';
                                rightArm.style.transform = '';
                                if (labelEl) labelEl.innerText = 'LGP Ativa';
                            }, 1200);
                        }
                    }, 220);
                }
            },

            speak(text) {
                if (!this.audioEnabled) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                const langMap = { pt: 'pt-PT', en: 'en-US', es: 'es-ES' };
                utterance.lang = langMap[CoreApp.currentLang] || 'pt-PT';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                
                window.speechSynthesis.speak(utterance);
                
                if (this.lgpEnabled) {
                    const lower = text.toLowerCase();
                    let matchedKey = null;

                    if (lower.includes('olá') || lower.includes('bem-vindo')) matchedKey = 'ola';
                    else if (lower.includes('música') || lower.includes('fado')) matchedKey = 'musica';
                    else if (lower.includes('bordar') || lower.includes('pintar')) matchedKey = 'bordar';
                    else if (lower.includes('máscara')) matchedKey = 'mascara';
                    else if (lower.includes('casa') || lower.includes('santana')) matchedKey = 'casa';
                    else if (lower.includes('cultura') || lower.includes('mural')) matchedKey = 'cultura';
                    else if (lower.includes('japão') || lower.includes('sombra') || lower.includes('tesouro')) matchedKey = 'japao';
                    else if (lower.includes('obrigado') || lower.includes('parabéns')) matchedKey = 'obrigado';

                    if (matchedKey && this.lgpDictionary[matchedKey]) {
                        const item = this.lgpDictionary[matchedKey];
                        this.animateLgpHands(item.gesture || 'wave', item.label);
                    } else {
                        this.animateLgpHands('rhythm', 'A traduzir...');
                    }
                }
            },

            vibrate(pattern = [50]) {
                if (this.vibrateEnabled && navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            },

            playChime(type = 'success') {
                try {
                    const synth = new Tone.Synth().toDestination();
                    const now = Tone.now();
                    if (type === 'success') {
                        synth.triggerAttackRelease("C5", "8n", now);
                        synth.triggerAttackRelease("G5", "8n", now + 0.15);
                    } else if (type === 'fanfare') {
                        synth.triggerAttackRelease("C5", "16n", now);
                        synth.triggerAttackRelease("E5", "16n", now + 0.1);
                        synth.triggerAttackRelease("G5", "16n", now + 0.2);
                        synth.triggerAttackRelease("C6", "4n", now + 0.3);
                    } else {
                        synth.triggerAttackRelease("A3", "8n", now);
                    }
                } catch(e) {
                    // Fallback
                }
            }
        };

            initCanvas() {

                this.canvas.height = rect.height || 315;

                this.ctx = this.canvas.getContext('2d');
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                this.drawBackgroundGuide();

                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseleave', () => this.stopDrawing());

                this.canvas.addEventListener('touchstart', (e) => {

            drawBackgroundGuide() {
                if (!this.ctx || !this.canvas) return;
                const w = this.canvas.width;
                const h = this.canvas.height;

                this.ctx.fillStyle = '#FFFDF7';
                this.ctx.fillRect(0, 0, w, h);

                this.ctx.strokeStyle = 'rgba(230, 220, 200, 0.4)';
                this.ctx.lineWidth = 1;
                for (let x = 0; x < w; x += 15) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, h);
                    this.ctx.stroke();
                }
                for (let y = 0; y < h; y += 15) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(w, y);
                    this.ctx.stroke();

                this.ctx.strokeStyle = '#EF476F';

                this.ctx.strokeRect(10, 10, w - 20, h - 20);

            drawHeartGuide(centerX, centerY, size, color, fill = false) {

                this.ctx.beginPath();
                const topCurveHeight = size * 0.3;
                this.ctx.moveTo(centerX, centerY + size * 0.7);
                this.ctx.bezierCurveTo(centerX - size, centerY, centerX - size, centerY - size * 0.7, centerX, centerY - topCurveHeight);
                this.ctx.bezierCurveTo(centerX + size, centerY - size * 0.7, centerX + size, centerY, centerX, centerY + size * 0.7);

                this.ctx.closePath();

                if (fill) {
                    this.ctx.fillStyle = 'rgba(255, 230, 230, 0.6)';
                    this.ctx.fill();
                }

                this.ctx.strokeStyle = '#EF476F';
                this.ctx.lineWidth = 3;
                this.ctx.setLineDash([8, 6]);
                this.ctx.stroke();
                this.ctx.restore();
            },

            drawHalfHeartGuide(centerX, centerY, size) {
                this.ctx.save();
                this.ctx.beginPath();
                const topCurveHeight = size * 0.3;
                this.ctx.moveTo(centerX, centerY + size * 0.7);
                this.ctx.bezierCurveTo(centerX - size, centerY, centerX - size, centerY - size * 0.7, centerX, centerY - topCurveHeight);
                
                this.ctx.fillStyle = 'rgba(239, 71, 111, 0.15)';
                this.ctx.fill();

                this.ctx.strokeStyle = '#EF476F';
                this.ctx.lineWidth = 4;
                this.ctx.stroke();

                this.ctx.fillStyle = '#118AB2';
                this.ctx.beginPath();
                this.ctx.arc(centerX - size * 0.4, centerY - size * 0.1, 8, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.fillStyle = '#FFD166';
                this.ctx.beginPath();
                this.ctx.arc(centerX - size * 0.4, centerY - size * 0.1, 4, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.moveTo(centerX, centerY - topCurveHeight);
                this.ctx.bezierCurveTo(centerX + size, centerY - size * 0.7, centerX + size, centerY, centerX, centerY + size * 0.7);
                this.ctx.strokeStyle = '#2B2D42';
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([6, 6]);
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.moveTo(centerX, centerY - size * 0.8);
                this.ctx.lineTo(centerX, centerY + size * 0.8);
                this.ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([4, 4]);
                this.ctx.stroke();

                this.ctx.restore();
            },

            getCoordinates(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (this.canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (this.canvas.height / rect.height)
                };
            },

            startDrawing(e) {
                this.isDrawing = true;
                const coords = this.getCoordinates(e);
                this.lastX = coords.x;
                this.lastY = coords.y;
            },

            draw(e) {
                if (!this.isDrawing || !this.ctx) return;
                const coords = this.getCoordinates(e);

                this.ctx.beginPath();
                this.ctx.moveTo(this.lastX, this.lastY);
                this.ctx.lineTo(coords.x, coords.y);
                
                this.ctx.strokeStyle = this.currentColor;
                this.ctx.lineWidth = this.brushSize;
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.arc(coords.x, coords.y, this.brushSize * 0.3, 0, Math.PI * 2);
                this.ctx.fillStyle = this.currentColor;
                this.ctx.fill();

                this.lastX = coords.x;
                this.lastY = coords.y;
            },

            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    AccessibilityModule.vibrate([15]);
                }
            },

            setColor(hex) {
                this.currentColor = hex;
                document.querySelectorAll('[id^="color-btn-"]').forEach(btn => {

                    btn.classList.add('border-white');

                const activeBtn = document.getElementById(`color-btn-${hex.replace('#','')}`);

                    activeBtn.classList.add('border-gray-800', 'scale-110', 'shadow');
                }
            },

                                <span class="bg-sky-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Saber Cultural</span>
                                <h3 class="text-xl font-black text-sky-800 mt-1">Casa de Santana (Madeira)</h3>
                                <p class="text-xs text-gray-700 mt-1">A forma triangular e o telhado de colmo inclinadamente pronunciado permitem escoar as águas das chuvas e manter o interior quente no inverno.</p>
                                
                                <button onclick='FichaObraModule.open(${JSON.stringify(levelInfo.fiche)}, "Casa Tradicional de Santana", "")' class="mt-3 btn-kid bg-brand-purple text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-book-open"></i> Ver Ficha de Obra Cultural (4 Questões)
                                </button>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="flex flex-wrap gap-3 justify-center">
                            <button onclick="Game5_Madeira.saveToMural()" class="btn-kid bg-brand-green text-white px-5 py-3 rounded-2xl font-bold text-sm flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> Guardar no Mural da Sala
                            </button>
                            ${this.currentLevel < 3 ? `
                                <button onclick="Game5_Madeira.start(${this.currentLevel + 1})" class="btn-kid bg-brand-pink text-white px-6 py-3 rounded-2xl font-bold text-sm flex items-center gap-2">
                                    Seguinte (Nível ${this.currentLevel + 1}) <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            ` : ''}
                            <button onclick="CoreApp.goHome()" class="btn-kid bg-brand-blue text-white px-5 py-3 rounded-2xl font-bold text-sm">
                                Voltar ao Início
                            </button>
                        </div>
                    </div>
                `;
            },

            saveToMural() {
                MuralState.addWork({
                    id: 'santana-sequence-' + Date.now(),
                    title: `Sequência da Casa de Santana (Nível ${this.currentLevel})`,
                    author: 'Criança Construtora',
                    region: 'Portugal (Madeira)',
                    coords: { x: 30, y: 65 },
                    date: new Date().toISOString().split('T')[0],
                    image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="%23e0f2fe"/><path d="M100 30 L30 160 L170 160 Z" fill="%23FFD166" stroke="%232B2D42" stroke-width="4"/><polygon points="60,160 100,80 140,160" fill="%23fff" stroke="%23EF476F" stroke-width="4"/><rect x="85" y="115" width="30" height="45" fill="%23118AB2"/></svg>',
                    fiche: this.levelsData[this.currentLevel].fiche
                });

                AccessibilityModule.speak("A tua conquista da Casa de Santana foi guardada no Mural da Sala!");
                CoreApp.openMural();
            }
        };

        const MuralModule = {
            viewMode: 'grid',

            render() {
                const content = document.getElementById('app-content');
                content.innerHTML = `
                    <div class="w-full my-2">
                        <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
                            <div>
                                <h2 class="text-3xl font-black text-brand-blue flex items-center gap-2">
                                    <i class="fa-solid fa-images"></i> Mural Virtual da Sala
                                </h2>
                                <p class="text-sm text-gray-600">Todas as criações das crianças e das famílias num só lugar!</p>
                            </div>

                            <div class="flex gap-2 bg-white p-2 rounded-2xl shadow border hc-element">
                                <button onclick="MuralModule.setView('grid')" class="px-4 py-2 rounded-xl font-bold text-sm ${this.viewMode === 'grid' ? 'bg-brand-blue text-white' : 'text-gray-600'}">
                                    <i class="fa-solid fa-table-cells-large"></i> Grelha
                                </button>
                                <button onclick="MuralModule.setView('timeline')" class="px-4 py-2 rounded-xl font-bold text-sm ${this.viewMode === 'timeline' ? 'bg-brand-blue text-white' : 'text-gray-600'}">
                                    <i class="fa-solid fa-timeline"></i> Linha do Tempo
                                </button>
                            </div>
                        </div>

                        <div id="mural-body">
                            ${this.renderViewContent()}
                        </div>
                    </div>
                `;
            },

            setView(mode) {
                this.viewMode = mode;
                this.render();
            },

            renderViewContent() {
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${MuralState.works.map(w => `
                            <div class="bg-white rounded-3xl p-4 border-4 border-gray-100 shadow-lg hover:shadow-xl transition relative hc-element">
                                <img src="${w.image}" class="w-full h-48 object-contain bg-gray-50 rounded-2xl border mb-3">
                                <span class="bg-brand-pink/20 text-brand-pink text-xs font-bold px-3 py-1 rounded-full uppercase">${w.region}</span>
                                <h3 class="text-xl font-black text-gray-800 mt-2">${w.title}</h3>
                                <p class="text-xs text-gray-500 font-bold mt-1"><i class="fa-solid fa-user"></i> Autor: ${w.author}</p>
                                
                                <button onclick='FichaObraModule.open(${JSON.stringify(w.fiche)}, "${w.title}", "${w.image}")' class="mt-4 w-full btn-kid bg-brand-yellow text-gray-900 py-2 rounded-2xl font-bold text-xs flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-book-open"></i> Ver Ficha da Obra
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        };

        const CultureModeModule = {
            render() {
                const content = document.getElementById('app-content');
                content.innerHTML = `
                    <div class="bg-white border-8 border-brand-green rounded-3xl p-6 max-w-2xl w-full text-center shadow-2xl hc-element animate-fade-in my-4">
                        <div class="w-20 h-20 bg-brand-green text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-3 shadow-lg">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                        <h2 class="text-3xl font-black text-brand-purple">A Minha Cultura Também Conta!</h2>
                        <p class="text-sm text-gray-600 mt-2 max-w-md mx-auto">
                            Cada criança e família traz consigo histórias, canções, tradições e memórias únicas. Tira uma foto ou partilha a tua história para o mural da sala!
                        </p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6 text-left">
                            <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200">
                                <h4 class="font-bold text-emerald-800 flex items-center gap-2">
                                    <i class="fa-solid fa-camera"></i> Partilhar Foto / Obra
                                </h4>
                                <p class="text-xs text-gray-600 mt-1">Carrega um objeto cultural ou desenho da tua família para expor no mural da sala.</p>
                            </div>
                            <div class="bg-purple-50 p-4 rounded-2xl border-2 border-purple-200">
                                <h4 class="font-bold text-purple-800 flex items-center gap-2">
                                    <i class="fa-solid fa-comments"></i> História / Canção
                                </h4>
                                <p class="text-xs text-gray-600 mt-1">Grava uma palavra ou melodia no teu idioma materno com a ajuda da família.</p>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3 justify-center">
                            <button onclick="CoreApp.goHome()" class="btn-kid bg-brand-blue text-white px-6 py-3 rounded-2xl font-bold text-sm">
                                Voltar ao Início
                            </button>
                        </div>
                    </div>
                `;
                AccessibilityModule.speak("A Minha Cultura Também Conta! Partilha com a turma as tradições e histórias da tua família.");
            }
        };

        window.onload = function() {
            CoreApp.init();
        };
    </script>
</body>
</html>
